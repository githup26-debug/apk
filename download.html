<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل التطبيق</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .card {
      width: min(92%, 420px);
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
    }
    h1 { margin-top: 0; }
    p { line-height: 1.7; color: #4b5563; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 28px;
      border-radius: 10px;
      background: #238636;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>تحميل التطبيق</h1>
    <p>سيبدأ تنزيل التطبيق تلقائيًا. إذا لم يبدأ، اضغط الزر.</p>
    <a id="downloadButton" href="./app.apk" download="app.apk">تحميل التطبيق</a>
  </main>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        window.location.href = "./app.apk";
      }, 800);
    });
  </script>
</body>
</html>
